# stropha.yaml — Unified configuration for stropha RAG system
# Optimized for Apple Silicon M5 Pro with 24GB unified memory
#
# Configuration precedence (highest to lowest):
#   1. CLI flags (--enricher, --embedder, etc.)
#   2. Environment variables (STROPHA_<STAGE>__<KEY>)
#   3. This file (stropha.yaml)
#   4. User config (~/.stropha/config.yaml)
#   5. Built-in defaults
#
# ENV vars are now only for:
#   - Secrets: VOYAGE_API_KEY, ANTHROPIC_API_KEY
#   - Paths: STROPHA_INDEX_PATH, STROPHA_TARGET_REPO
#   - Hook settings: STROPHA_HOOK_* (subprocess, can't read YAML)

pipeline:
  # Walker: how files are discovered
  walker:
    adapter: git-ls-files
    config:
      max_file_bytes: 524288  # 512KB max file size

  # Chunker: how files are split into semantic units
  chunker:
    adapter: tree-sitter-dispatch
    config: {}

  # Enricher: LLM-generated context prepended to chunks before embedding
  # Options: noop, hierarchical, graph-aware, ollama, mlx, contextual
  enricher:
    adapter: contextual
    config:
      temperature: 0.0
      max_tokens: 256
      max_content_chars: 4000
      max_description_chars: 500

  # Embedder: converts text to vectors
  # Options: local (ONNX), voyage (cloud), mlx (Apple Silicon GPU), bge-m3
  embedder:
    adapter: mlx
    config:
      model: bge-m3  # Best multilingual + code understanding, 1024-dim
      batch_size: 64  # MLX handles larger batches efficiently

  # Storage: vector + FTS5 + metadata
  storage:
    adapter: sqlite-vec
    config: {}

  # Retrieval: hybrid search with RRF fusion
  retrieval:
    adapter: hybrid-rrf
    config:
      k: 60  # RRF smoothing parameter

# Inference: LLM backend for enrichment, HyDE, query decomposition
inference:
  backend: mlx  # Options: mlx, ollama, or null (auto-detect)
  mlx_model: mlx-community/Qwen2.5-Coder-7B-Instruct-4bit
  ollama_model: qwen2.5-coder:7b
  ollama_host: http://localhost:11434

# Query-time features (no re-index needed to change these)
retrieval_features:
  # HyDE: generate hypothetical code before embedding query
  hyde_enabled: true
  hyde_code_tuned: true  # Use code-specific prompts
  
  # Query decomposition: split complex queries into sub-queries
  query_decomposition_enabled: true
  query_decomposition_llm: false  # Pattern-based by default
  
  # Query routing: auto-dispatch to graph tools
  query_router_llm: false  # Pattern-based by default
  
  # Query rewrite: expand natural language to code terms
  query_rewrite_enabled: false
  
  # Multi-query: generate paraphrases and fuse results
  multi_query_enabled: false
  multi_query_count: 3
  
  # Recursive retrieval: merge parent + adjacent chunks
  recursive_enabled: true
  recursive_adjacency: 5  # Lines gap considered adjacent
  
  # Query cache: in-memory LRU cache for repeated queries
  cache_enabled: true
  cache_size: 500
  cache_ttl: 3600  # 1 hour

# Graph integration settings
graph:
  confidence: EXTRACTED  # Edge confidence filter (EXTRACTED, INFERRED)
  fts_augment: true  # Retroactive FTS5 augmentation with graph labels
