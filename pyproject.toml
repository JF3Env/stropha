[project]
name = "stropha"
version = "0.1.0"
description = "RAG indexer for codebases, exposed to LLM clients via the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jonatas" }]
keywords = ["rag", "retrieval", "mcp", "code-search", "llm", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]

# Core dependencies — minimal set for CLI + MCP server
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "pathspec>=0.12",
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/JonatasFischer/stropha"
Documentation = "https://github.com/JonatasFischer/stropha#readme"
Repository = "https://github.com/JonatasFischer/stropha.git"
Issues = "https://github.com/JonatasFischer/stropha/issues"

[project.scripts]
stropha = "stropha.cli:app"
stropha-mcp = "stropha.server:main"

[project.optional-dependencies]
# MCP server with lightweight embeddings — recommended for quick start
mcp = [
    "model2vec>=0.3",    # Ultra-fast static embeddings (default for MCP)
]

# Full local experience — fastembed + tree-sitter chunking
local = [
    "fastembed>=0.4",              # ONNX-based transformer embeddings
    "tree-sitter>=0.23",           # AST-aware chunking
    "tree-sitter-language-pack>=0.10",
]

# Cloud embeddings (higher quality, requires API key)
voyage = [
    "voyageai>=0.3",
]

# All embedders — fastembed + voyage + model2vec
embedders = [
    "fastembed>=0.4",
    "voyageai>=0.3",
    "model2vec>=0.3",
]

# Full feature set (local + voyage + tree-sitter)
full = [
    "fastembed>=0.4",
    "voyageai>=0.3",
    "model2vec>=0.3",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.10",
]

# Development dependencies
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

# Apple Silicon native LLM inference for the `mlx` enricher adapter.
# Skip on Linux / Intel macs / Windows — `mlx-lm` is Apple-only.
mlx = [
    "mlx-lm>=0.18; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

# Apple Silicon GPU-accelerated embeddings via mlx-embedding-models and mlx-lm.
# mlx-lm supports MLX-converted Qwen3 embedding checkpoints. Apple Silicon only.
mlx-embed = [
    "mlx-embedding-models>=0.0.11; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.24; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "transformers>=4.36,<5.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

# Native NVIDIA CUDA execution via PyTorch + SentenceTransformers.
nvidia = [
    "sentence-transformers>=3.2; platform_system != 'Darwin'",
]

# Native AMD ROCm execution. Install the ROCm-specific PyTorch wheel for the
# host before selecting this adapter; SentenceTransformers uses torch's cuda API.
amd = [
    "sentence-transformers>=3.2; platform_system == 'Linux'",
]

# Native Intel NPU execution through the SentenceTransformers OpenVINO backend.
intel-npu = [
    "sentence-transformers[openvino]>=3.2; platform_system == 'Linux' or platform_system == 'Windows'",
]

# Model2Vec static embeddings — ultra-fast lookup-based embeddings
model2vec = [
    "model2vec>=0.3",
]

# PostgreSQL + pgvector storage backend (MVCC: concurrent index + serve).
# Pair with a running Postgres that has the `vector` extension — e.g.
# `STROPHA_USE_POSTGRES=1 bin/stropha-mcp-ensure` brings one up via Docker.
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stropha"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: line length handled by `line-length = 100` above (formatter only).
# RUF001/002/003: this codebase uses typographic em-dashes (—), en-dashes
#   (–) and multiplication signs (×) intentionally in docstrings and
#   comments (architecture writing, ranges like "10³–10⁴", "2× faster").
#   They are not ambiguous in context.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# sqlite3.Row supports ``"key" in row.keys()`` but NOT ``"key" in row``
# (the latter iterates VALUES, not column names). Same for ``.get()`` —
# sqlite3.Row has neither, so SIM118 must not auto-rewrite these idioms.
"src/stropha/storage/sqlite.py" = ["SIM118"]
"src/stropha/retrieval/graph.py" = ["SIM118"]
"src/stropha/retrieval/recursive.py" = ["SIM118"]
"src/stropha/adapters/retrieval/streams/graph_vec.py" = ["SIM118"]
# Typer subcommands rely on ``typer.Option(...)`` / ``typer.Argument(...)``
# as default values — that's the idiomatic Typer API surface, same shape
# as FastAPI dependencies. B008 has no model for these decorator-bound
# defaults, so suppress in the CLI composition root only.
"src/stropha/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: spawns subprocess / hits the network; skipped in fast CI runs.",
    "e2e: end-to-end against a real target repo.",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
