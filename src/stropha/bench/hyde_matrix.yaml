# Phase 6 selective HyDE development matrix.
# Reuse the search split while tuning; holdout requires a separately frozen batch.

repo: .
golden: tests/eval/golden.jsonl
top_k: 10

axes:
  embedder: [model2vec]
  enricher: [noop]
  hyde: [false, true]
  hyde_code_tuned: [true]

baseline:
  embedder: model2vec
  enricher: noop
  hyde: false
  hyde_code_tuned: true

constraints: []
