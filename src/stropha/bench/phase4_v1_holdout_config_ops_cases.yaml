version: 1
cases:
  - id: phase4-config-001
    query: Where does stropha decide the repository to operate on when no --repo is given, and which setting is a runtime argument rather than persistent YAML configuration?
    expected_paths:
      - src/stropha/config/__init__.py
      - src/stropha/cli.py
    expected_symbols:
      - _parse_paths
      - index
    relevance:
      src/stropha/config/__init__.py: 3
      src/stropha/cli.py: 2
      _parse_paths: 3
      index: 2
    tags: [config-ops]
    split: holdout

  - id: phase4-config-002
    query: How are persistent adapter settings resolved when callers still pass the old project_root or environ arguments, and which source wins over the user YAML?
    expected_paths:
      - src/stropha/config/__init__.py
      - src/stropha/pipeline/config.py
    expected_symbols:
      - load_config
      - load_pipeline_config
    relevance:
      src/stropha/config/__init__.py: 3
      src/stropha/pipeline/config.py: 3
      load_config: 3
      load_pipeline_config: 3
    tags: [config-ops]
    split: holdout

  - id: phase4-config-003
    query: If a backend-specific enrichment batch size is configured but I also pass --batch-size, what precedence does indexing use?
    expected_paths:
      - src/stropha/config/models.py
      - src/stropha/cli.py
    expected_symbols:
      - InferenceConfig.effective_batch_size
      - index
    relevance:
      src/stropha/config/models.py: 3
      src/stropha/cli.py: 3
      InferenceConfig.effective_batch_size: 3
      index: 3
    tags: [config-ops]
    split: holdout

