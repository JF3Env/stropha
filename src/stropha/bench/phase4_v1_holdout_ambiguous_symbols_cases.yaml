version: 1
cases:
  - id: phase4-ambiguous-001
    query: "I'm looking for search: which implementation owns dense, sparse, and symbol fusion, not the adapter that only delegates to FTS5 BM25?"
    expected_paths:
      - src/stropha/retrieval/search.py
      - src/stropha/adapters/retrieval/streams/fts5_bm25.py
    expected_symbols:
      - SearchEngine.search
      - Fts5Bm25Stream.search
    relevance:
      src/stropha/retrieval/search.py: 3
      SearchEngine.search: 3
      src/stropha/adapters/retrieval/streams/fts5_bm25.py: 1
      Fts5Bm25Stream.search: 1
    tags: [ambiguous-symbols]
    split: holdout

  - id: phase4-ambiguous-002
    query: "Two retrieval streams expose search; where is graph-node cosine search, and where is the independent Model2Vec chunk-vector search?"
    expected_paths:
      - src/stropha/adapters/retrieval/streams/graph_vec.py
      - src/stropha/adapters/retrieval/streams/model2vec_cosine.py
    expected_symbols:
      - GraphVecStream.search
      - Model2VecCosineStream.search
    relevance:
      src/stropha/adapters/retrieval/streams/graph_vec.py: 3
      GraphVecStream.search: 3
      src/stropha/adapters/retrieval/streams/model2vec_cosine.py: 3
      Model2VecCosineStream.search: 3
    tags: [ambiguous-symbols]
    split: holdout

  - id: phase4-ambiguous-003
    query: "Which run method owns the configured indexing pipeline and graphify lifecycle, rather than the older walk-and-index loop?"
    expected_paths:
      - src/stropha/pipeline/pipeline.py
      - src/stropha/ingest/pipeline.py
    expected_symbols:
      - Pipeline.run
      - IndexPipeline.run
    relevance:
      src/stropha/pipeline/pipeline.py: 3
      Pipeline.run: 3
      src/stropha/ingest/pipeline.py: 1
      IndexPipeline.run: 1
    tags: [ambiguous-symbols]
    split: holdout

