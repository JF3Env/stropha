# Multi-day quality campaign. Broad search stages discover candidates, repeated
# stages measure LLM-reranker stability, and focused holdout stages validate only
# predeclared parameter families. Index artifacts are reused across every stage.
version: 1
name: comprehensive-quality-v3
split: search
holdout_note: Previously exposed holdout; valid for repeatability and regression evidence,
  but not an unbiased estimate of generalization. Promotion still requires new unseen cases.

stages:
  - id: query-rewrite
    matrix: src/stropha/bench/query_rewrite_matrix.yaml
  - id: hyde
    matrix: src/stropha/bench/hyde_matrix.yaml
  - id: multi-query
    matrix: src/stropha/bench/multi_query_matrix.yaml
  - id: diversity
    matrix: src/stropha/bench/diversity_matrix.yaml
  - id: phase2-shortlist
    matrix: src/stropha/bench/phase2_shortlist_matrix.yaml
  - id: local-quality
    matrix: src/stropha/bench/local_quality_matrix.yaml
  - id: indexing-confirmation
    matrix: src/stropha/bench/indexing_quality_shortlist_matrix.yaml
    repetitions: 10
    min_repetitions: 4
  - id: active-discovery
    matrix: src/stropha/bench/active_matrix.yaml
  - id: active-confirmation
    matrix: src/stropha/bench/active_quality_shortlist_matrix.yaml
    repetitions: 10
    min_repetitions: 4

  # Holdout sees only the frozen finalists above, never a discovery matrix.
  - id: indexing-holdout
    matrix: src/stropha/bench/indexing_quality_shortlist_matrix.yaml
    split: holdout
    repetitions: 10
    min_repetitions: 4
  - id: active-retrieval-holdout
    matrix: src/stropha/bench/active_quality_shortlist_matrix.yaml
    split: holdout
    repetitions: 10
    min_repetitions: 4
